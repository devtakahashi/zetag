<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Payment request | ZeTag</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/png" href="../zetag-icon.png">
  <script src="../request-data.js" defer></script>
  <script src="../pay.js" defer></script>
</head>
<body>
<header><a class="brand" href="../"><span class="brand-mark" aria-hidden="true"></span>ZeTag</a></header>
<main class="checkout-main">
  <article class="card request-card" aria-labelledby="pay-title">
    <h1 id="pay-title">Payment request</h1>
    <p id="pay-status" class="help" role="status">Loading payment request…</p>
    <div id="pay-details" hidden>
      <p class="request-amount"><strong id="pay-amount"></strong> <span>USDC</span></p>
      <p class="request-note" id="pay-note" hidden></p>
      <p class="request-person">Pay to <strong id="pay-name"></strong><br><span id="pay-tag"></span></p>
      <div class="checkout-network"><span class="solana-mark" aria-hidden="true"><i></i><i></i><i></i></span>Solana</div>
      <button class="primary" id="pay-button" type="button" disabled>Pay USDC</button>
      <p class="help">Payments are currently unavailable.</p>
    </div>
  </article>
</main>
</body>
</html>
