name = "zetag-pay"
main = "worker.mjs"
compatibility_date = "2025-06-01"
workers_dev = false
routes = [{ pattern = "zetag.fun/pay/*", zone_name = "zetag.fun" }]

[assets]
directory = "../pay"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "zetag-requests"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
